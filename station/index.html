<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paperboat Station</title>
    <link rel="stylesheet" href="style.css" />
    <script src="_static/three.min.js"></script>
  </head>
  <body>
    <div id="stationContainer">
      <canvas id="threeCanvas"></canvas>

      <!-- Sea HUD Overlay -->
      <div class="sea-hud">
        <div class="hud-top">
          <div class="loot-manifest">
            <span class="loot-item loot-coins">🪙 <span id="lootCoins">0</span></span>
            <span class="loot-item loot-chest">📦 <span id="lootChest">0</span></span>
          </div>

          <div id="statusBadge">Ready</div>

          <div class="wind-compass">
            <span class="compass-label comp-n">N</span>
            <span class="compass-label comp-s">S</span>
            <span class="compass-label comp-w">W</span>
            <span class="compass-label comp-e">E</span>
            <div class="wind-arrow-box" id="windNeedleBox">
              <div class="wind-needle"></div>
            </div>
            <div class="wind-readout" id="windReadout">NW 14 kt</div>
          </div>
        </div>

        <div class="hud-right-telemetry">
          <div class="speed-gauge">
            <div class="speed-val" id="hudSpeed">0</div>
            <div class="speed-unit">KNOTS</div>
          </div>
          <div class="sail-slider-wrap">
            <span class="sail-label">SAIL</span>
            <div class="sail-track">
              <div class="sail-thumb" id="sailThumb"></div>
            </div>
            <span class="sail-angle-text" id="hudSailAngle">42°</span>
          </div>

          <div class="sail-dir-widget" id="sailDirWidget">
            <div class="sail-dir-header">SAIL DIRECTION</div>
            <div class="sail-dir-dial">
              <span class="sail-side-marker marker-port">P</span>
              <span class="sail-side-marker marker-stbd">S</span>
              <svg class="sail-dial-svg" viewBox="0 0 64 64">
                <!-- Boat hull silhouette (top-down) -->
                <path d="M 32 8 C 38 18, 42 32, 40 54 L 24 54 C 22 32, 26 18, 32 8 Z" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" />
                <line x1="32" y1="10" x2="32" y2="52" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2 2" stroke-width="1" />
                <!-- Mast center point -->
                <circle cx="32" cy="28" r="2.5" fill="#fef08a" />
                <!-- Dynamic Sail Boom -->
                <g id="sailBoomGroupSvg" transform="rotate(0 32 28)">
                  <line x1="32" y1="28" x2="32" y2="48" stroke="#ff5a1f" stroke-width="2.5" stroke-linecap="round" />
                  <polygon points="32,28 35,46 32,48" fill="#fef08a" opacity="0.8" />
                </g>
                <!-- Apparent wind arrow pointer -->
                <g id="sailAppWindGroup" transform="rotate(0 32 32)">
                  <line x1="32" y1="3" x2="32" y2="15" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
                  <polygon points="32,17 29,12 35,12" fill="#38bdf8" />
                </g>
              </svg>
            </div>
            <div class="sail-tack-badge" id="hudSailTack">PORT 42°</div>
          </div>
        </div>

        <div class="hud-bottom">
          <div class="captain-plate">
            <div class="captain-name">Paperboat</div>
            <div class="captain-sub">Scheme C · Mediterranean Azure</div>
          </div>

          <div class="helm-box">
            <div class="helm-wheel" id="helmWheel"></div>
            <span class="helm-label">RUDDER</span>
          </div>
        </div>
      </div>
    </div>

    <script src="/paperboat/station.js"></script>
    <script src="paperboat.js"></script>
  </body>
</html>
