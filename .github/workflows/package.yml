name: Verify & Package Backend

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install jsonschema tomli

      - name: Verify backend layout & manifest
        id: manifest
        run: |
          python3 -c "
          import tomllib, os
          with open('backend.toml', 'rb') as f:
              data = tomllib.load(f)
          b = data['backend']
          assert b['format'] == 0, f'Expected format 0, got {b[\"format\"]}'
          assert b['name'] == 'paperboat-paperboat'
          assert b['language'] == 'python'
          assert os.path.isfile(b['descriptor'])
          assert os.path.isfile(b['run'])
          name = b['name']
          version = b.get('version', '0.1.0')
          tag = f'v{version}' if not version.startswith('v') else version
          gh_out = os.environ.get('GITHUB_OUTPUT')
          if gh_out:
              with open(gh_out, 'a') as out:
                  out.write(f'name={name}\n')
                  out.write(f'version={version}\n')
                  out.write(f'tag={tag}\n')
          print(f'backend.toml verified: {name} v{version} (release tag: {tag})')
          "

      - name: Package backend archive (.ppk)
        run: |
          python3 scripts/package_backend.py pack .
          ls -la *.ppk
          sha256sum *.ppk > checksums.txt
          cat checksums.txt

      - name: Verify package unpack & integrity
        run: |
          PKG_FILE=$(ls *.ppk | head -n 1)
          python3 scripts/package_backend.py unpack "$PKG_FILE" --dir /tmp/test_unpack
          echo "Verified $PKG_FILE extraction and SHA-256 integrity"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperboat-package
          path: |
            *.ppk
            checksums.txt

      - name: Publish GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag }}
          name: ${{ steps.manifest.outputs.name }} v${{ steps.manifest.outputs.version }}
          draft: false
          prerelease: false
          files: |
            *.ppk
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
